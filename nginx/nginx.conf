# =============================================================================
# EARTHQUAKE CATALOGUE PLATFORM - REVERSE PROXY
# =============================================================================
# Mounted as /etc/nginx/nginx.conf by the "with-nginx" profile of
# docker-compose.prod.yml:
#
#   APP_BIND_ADDRESS=127.0.0.1 docker compose -f docker-compose.prod.yml --profile with-nginx up -d
#
# Why this proxy matters: the app's rate limits (registration, password reset,
# credential login) key on the client address in X-Forwarded-For, using the
# entry added by the last trusted proxy (TRUSTED_PROXY_HOPS=1, the default).
# Next.js only fills that header in when it is missing, so if clients can reach
# the app directly they choose their own key. Two things are needed:
#
#   1. This proxy OVERWRITES X-Forwarded-For with the address it sees
#      ($remote_addr) instead of appending to whatever the client sent.
#   2. Clients cannot bypass it: publish the app on 127.0.0.1 only
#      (APP_BIND_ADDRESS=127.0.0.1) or not at all. nginx reaches it over the
#      compose network as app:3000.
#
# If another proxy or load balancer sits in front of this nginx, make
# $remote_addr the real client with the realip module, for example
#     set_real_ip_from 10.0.0.0/8;          # the load balancer's addresses
#     real_ip_header   X-Forwarded-For;
#     real_ip_recursive on;
# and keep TRUSTED_PROXY_HOPS=1. Without that, every client shares the load
# balancer's address and therefore one rate-limit bucket.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # The catalogue upload API accepts request bodies up to 100 MB.
    client_max_body_size 100m;

    upstream catalogue_app {
        server app:3000;
        keepalive 32;
    }

    # The Host header as the browser sent it, port included; the server name if absent.
    # The app compares a request's Origin with this, port and all (middleware.ts).
    map $http_host $public_host {
        ''      $host;
        default $http_host;
    }

    # Headers for the app. Declared once here so every server block inherits
    # them; do not add proxy_set_header inside a server or location block, as
    # that replaces this whole list for that block.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $public_host;
    # Overwrite, never append ($proxy_add_x_forwarded_for would keep the
    # client's own value in front of ours).
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Host  $public_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    # GeoNet imports can run for up to 300 seconds.
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;

    server {
        listen 80;
        server_name _;

        # Once the HTTPS server below is enabled, replace this location with:
        #     return 301 https://$host$request_uri;
        location / {
            proxy_pass http://catalogue_app;
        }
    }

    # HTTPS: put fullchain.pem and privkey.pem in ./nginx/ssl (mounted at
    # /etc/nginx/ssl), then uncomment this server block.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_session_cache   shared:SSL:10m;
    #
    #     location / {
    #         proxy_pass http://catalogue_app;
    #     }
    # }
}
